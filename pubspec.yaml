name: arquitectos_loyola
description: Plataforma móvil para gestión de proyectos de Arquitectos Loyola (clientes y arquitectos).
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  youtube_player_iframe: ^5.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/
